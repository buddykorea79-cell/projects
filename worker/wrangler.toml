name = "assignment-hub-proxy"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
REPO_OWNER = "buddykorea79-cell"
REPO_NAME  = "projects"
REPO_BRANCH = "main"
# 이 사이트 주소만 쓰기를 허용합니다. 쉼표로 여러 개 지정 가능.
ALLOWED_ORIGINS = "https://buddykorea79-cell.github.io"

# 시크릿은 파일에 넣지 말고 CLI 로 등록하세요.
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put TURNSTILE_SECRET   (선택)
