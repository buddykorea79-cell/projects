# R2 저장소 API 를 독립 Worker 로 띄울 때만 쓰는 설정입니다.
# Cloudflare Pages 로 배포한다면 이 파일은 필요 없습니다
# (functions/api/[[path]].js 가 같은 일을 사이트와 같은 도메인에서 합니다).

name = "assignment-hub-r2"
main = "r2-worker.js"
compatibility_date = "2024-11-01"

[[r2_buckets]]
binding = "BUCKET"          # 이 이름 그대로여야 합니다
bucket_name = "assignment-hub"

[vars]
MAX_UPLOAD_MB = "100"
# 사이트가 다른 도메인에 있으므로 반드시 지정해야 합니다.
ALLOWED_ORIGINS = "https://example.pages.dev"

# 강의자료 다운로드를 서버에서 잠그려면 (선택):
#   wrangler secret put MATERIALS_PASSWORD --config wrangler.r2.toml
#   wrangler secret put TOKEN_SECRET       --config wrangler.r2.toml
