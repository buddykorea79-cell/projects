name: Deploy to GitHub Pages

# 현재 이 사이트는 Cloudflare Pages 로 배포합니다.
# 이 워크플로는 GitHub Pages 로 되돌릴 때를 위해 남겨둔 것이라
# 자동 실행하지 않습니다 (Actions 탭에서 수동으로 실행).
# GitHub Pages 가 켜져 있지 않은 상태로 자동 실행되면 매 푸시마다 실패로 뜹니다.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩. 진행 중인 배포는 취소하지 않습니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # 빌드 단계가 없는 순수 정적 사이트입니다. 레포 루트를 그대로 올립니다.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
